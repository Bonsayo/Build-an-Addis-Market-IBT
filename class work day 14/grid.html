<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="grid.css" />
    <title>CSS Grid Classroom Diagram</title>
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <h1>CSS Grid Classroom Diagram</h1>
        
      </header>

      <section class="diagram-card">
        <div class="grid-container">
          <div class="grid-cell header">HEADER</div>
          <div class="grid-cell featured">FEATURED ARTICLE</div>
          <div class="grid-cell article article1">ARTICLE 1</div>
          <div class="grid-cell article article2">ARTICLE 2</div>
          <div class="grid-cell article article4">ARTICLE 4</div>
          <div class="grid-cell article article5">ARTICLE 5</div>
          <div class="grid-cell article article6">ARTICLE 6</div>
        </div>
      </section>
    </main>
  </body>
</html>
